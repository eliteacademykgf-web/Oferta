server {
    server_name offer.eliteacademy.kg;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/offer.eliteacademy.kg/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/offer.eliteacademy.kg/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = offer.eliteacademy.kg) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name offer.eliteacademy.kg;
    return 404; # managed by Certbot
}
